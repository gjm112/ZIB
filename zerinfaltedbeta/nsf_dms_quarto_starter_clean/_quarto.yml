project:
  type: default
  output-dir: output

execute:
  freeze: auto
  echo: false
  warning: false
  message: false

format:
  pdf:
    documentclass: article
    papersize: letter
    fontsize: 11pt
    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in
    linestretch: 1.0
    pdf-engine: pdflatex
    number-sections: false
    toc: false
    fig-pos: H
    tbl-pos: H
    keep-tex: true
    colorlinks: false
    cite-method: natbib
    include-in-header:
      - text: |
          \usepackage{setspace}
          \usepackage{float}
          \usepackage{microtype}
          \usepackage{fancyhdr}
          \usepackage{lastpage}
          \usepackage{enumitem}
          \usepackage{booktabs}
          \usepackage{longtable}
          \usepackage{array}
          \usepackage{amsmath,amssymb,amsthm}
          \usepackage{graphicx}
          \usepackage{xurl}
          \usepackage[hidelinks]{hyperref}

          \setlength{\parindent}{0pt}
          \setlength{\parskip}{4pt}
          \setlength{\textfloatsep}{8pt plus 2pt minus 2pt}
          \setlength{\floatsep}{6pt plus 2pt minus 2pt}
          \setlength{\intextsep}{8pt plus 2pt minus 2pt}

          \pagestyle{fancy}
          \fancyhf{}
          \fancyfoot[C]{\thepage}
          \renewcommand{\headrulewidth}{0pt}
          \renewcommand{\footrulewidth}{0pt}
          
bibliography: references.bib

editor: visual
